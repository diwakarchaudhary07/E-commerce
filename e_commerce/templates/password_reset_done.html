{% extends 'base.html' %}

{% block title %}Password Reset Sent | Easy Kart{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h2 class="fw-bold">Check your email</h2>
                <p class="text-muted">If an account exists for that email, we have sent a password reset link. Please follow the instructions in the email.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

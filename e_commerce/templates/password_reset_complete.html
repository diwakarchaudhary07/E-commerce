{% extends 'base.html' %}

{% block title %}Password Reset Complete | Easy Kart{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h2 class="fw-bold">Password reset complete</h2>
                <p class="text-muted">Your password has been updated successfully. You can now sign in with your new password.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Password Reset Sent | Easy Kart{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body text-center p-4">
                <h2 class="fw-bold">Reset link sent</h2>
                <p class="text-muted">If your email is registered with Easy Kart, you should receive a password reset link shortly.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">Back to sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
